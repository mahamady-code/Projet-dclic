<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <rect width="400" height="240" fill="#f0fdf4" rx="8" />
  <rect x="20" y="20" width="360" height="200" fill="#ffffff" stroke="#86efac" stroke-width="2" rx="8" />
  <rect x="20" y="20" width="360" height="34" fill="#16a34a" rx="8 8 0 0" />
  <text x="200" y="42" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Simulateur de Prêt Bancaire</text>
  <!-- Interface calculatrice -->
  <rect x="50" y="75" width="170" height="120" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <rect x="65" y="90" width="140" height="18" fill="#e2e8f0" rx="3" />
  <text x="70" y="103" fill="#64748b" font-family="sans-serif" font-size="9">Montant emprunté (€)</text>
  <rect x="65" y="120" width="140" height="18" fill="#e2e8f0" rx="3" />
  <text x="70" y="133" fill="#64748b" font-family="sans-serif" font-size="9">Durée (années) &amp; Taux (%)</text>
  <rect x="65" y="150" width="140" height="26" fill="#16a34a" rx="4" />
  <text x="135" y="167" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Calculer la Mensualité</text>
  <!-- Résultat -->
  <rect x="240" y="85" width="120" height="100" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" rx="6" />
  <text x="300" y="115" fill="#15803d" font-family="sans-serif" font-size="10" text-anchor="middle">Mensualité :</text>
  <text x="300" y="145" fill="#166534" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">425,80 €</text>
  <text x="300" y="168" fill="#15803d" font-family="sans-serif" font-size="9" text-anchor="middle">Coût total maîtrisé</text>
</svg>